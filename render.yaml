# Render Blueprint — StormRoute API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stormroute-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: MAPBOX_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
        # e.g. stormroute-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
        # Exact frontend origin only, e.g. https://stormroute.vercel.app
      - key: GEOCODE_COUNTRY
        value: us
      - key: THROTTLE_RATE
        value: 60/min
      - key: REDIS_URL
        sync: false
        # Optional — leave empty for LocMemCache (single gthread worker)
      - key: APP_VERSION
        value: "0.1.0"
      - key: SECURE_SSL_REDIRECT
        value: "true"
